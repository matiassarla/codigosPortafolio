function capitalizarNombresEnUnaHoja() {
  const nombreHoja = "NombreDeTuHoja"; // <-- Cambiá esto por el nombre real de tu hoja
  const hoja = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(nombreHoja);

  if (!hoja) {
    Logger.log("No se encontró la hoja con ese nombre.");
    return;
  }

  const rango = hoja.getRange("A1:A" + hoja.getLastRow());
  const valores = rango.getValues();

  const nuevosValores = valores.map(fila => {
    const texto = fila[0];
    if (typeof texto === "string") {
      const capitalizado = texto.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
      return [capitalizado];
    } else {
      return [texto];
    }
  });

  rango.setValues(nuevosValores);
  SpreadsheetApp.flush();
  Logger.log("Capitalización completada.");
}
